name: Update funds

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch funds
        run: python3 fetch_funds.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add funds.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update funds"
            git push
          fi
